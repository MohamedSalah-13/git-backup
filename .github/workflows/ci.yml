name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  desktop:
    name: Desktop app (build and tests)
    # The app targets Windows (DPAPI, tray, Windows paths), so it is built and tested there.
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and run tests
        run: mvn -B -ntp -f desktop/pom.xml verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: desktop/target/surefire-reports
          if-no-files-found: ignore

  scripts:
    name: PowerShell scripts (syntax)
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # Windows PowerShell 5.1 is what the scripts run on at the user's machine.
      - name: Parse every script
        shell: powershell
        run: |
          $failed = $false
          Get-ChildItem -Path . -Recurse -Filter *.ps1 | ForEach-Object {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errors)
            if ($errors) {
              $failed = $true
              foreach ($e in $errors) { Write-Host "::error file=$($_.FullName),line=$($e.Extent.StartLineNumber)::$($e.Message)" }
            } else {
              Write-Host "OK  $($_.FullName)"
            }
          }
          if ($failed) { exit 1 }

      # Without the BOM, Windows PowerShell misreads the Arabic text of the window.
      - name: backup-gui.ps1 keeps its UTF-8 BOM
        shell: powershell
        run: |
          $bytes = [System.IO.File]::ReadAllBytes((Join-Path $PWD 'backup-gui.ps1'))
          if (-not ($bytes[0] -eq 0xEF -and $bytes[1] -eq 0xBB -and $bytes[2] -eq 0xBF)) {
            Write-Host '::error file=backup-gui.ps1::The UTF-8 BOM is missing; save the file as "UTF-8 with BOM".'
            exit 1
          }
