name: Packages (Linux, macOS)

# jpackage only builds for the system it runs on, so the Linux and macOS installers are made here.
# The Windows installer is still built and published from the developer's computer by
# desktop/packaging/release.ps1; publishing that release starts this workflow, which adds its
# files to the same release.
on:
  release:
    types: [published]
  # A change to the packaging is tried out before it is merged; the installers are kept as artifacts.
  pull_request:
    paths:
      - desktop/packaging/**
      - desktop/pom.xml
      - .github/workflows/packages.yml
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and add the installers to (empty builds this branch, artifacts only)
        required: false
        default: ''

concurrency:
  group: packages-${{ github.event.release.tag_name || inputs.tag || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  package:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: write # adds the installers to the release
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux (.deb)
            os: ubuntu-latest
          - name: macOS Apple Silicon (.dmg)
            os: macos-latest
          - name: macOS Intel (.dmg)
            os: macos-15-intel
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Install what jpackage needs for a .deb
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fakeroot

      - name: Build the installer
        shell: pwsh
        run: ./desktop/packaging/build-installer.ps1

      - name: Keep the installer with this run
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: desktop/target/installer/GitBackup-*
          if-no-files-found: error

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-${{ matrix.os }}
          path: desktop/target/surefire-reports
          if-no-files-found: ignore

      - name: Add the installer to the release
        if: env.RELEASE_TAG != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" desktop/target/installer/GitBackup-* --clobber --repo "$GITHUB_REPOSITORY"
