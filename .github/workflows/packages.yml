name: Packages (Linux, macOS)

# jpackage only builds for the system it runs on, so the Linux and macOS installers are made here.
# The Windows installer is still built and published from the developer's computer by
# desktop/packaging/release.ps1; publishing that release starts this workflow, which adds its
# files to the same release.
on:
  release:
    types: [published]
  # A change to the packaging is tried out before it is merged; the installers are kept as artifacts.
  pull_request:
    paths:
      - desktop/packaging/**
      - desktop/pom.xml
      - .github/workflows/packages.yml
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and add the installers to (empty builds this branch, artifacts only)
        required: false
        default: ''

concurrency:
  group: packages-${{ github.event.release.tag_name || inputs.tag || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  packages:
    name: Packages
    # The jobs are desktop-updater's shared ones: build-installer.ps1 on Linux and on both kinds of Mac.
    # Pinned to a commit, so nothing changes here without a pull request in this repository.
    uses: MohamedSalah-13/desktop-updater/.github/workflows/package-unix.yml@2a9688b72357c3ab55a1a1414bdb910aa77988f8
    permissions:
      contents: write # adds the installers to the release
    with:
      script: desktop/packaging/build-installer.ps1
      files: desktop/target/installer/GitBackup-*
      tag: ${{ github.event.release.tag_name || inputs.tag }}
      test-reports: desktop/target/surefire-reports
